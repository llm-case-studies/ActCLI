[project]
name = "actcli"
version = "0.0.1"
description = "ActCLI — terminal-native actuarial workflows with multi-model roundtable chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "platformdirs>=4.0.0",
  "readchar>=4.0.5",
  "fastapi>=0.112.0",
  "pydantic>=2.6.0",
  "websockets>=12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
auth = [
  "keyring>=25.0.0",
  "google-api-python-client>=2.88.0",
  "google-auth-httplib2>=0.1.1",
  "google-auth-oauthlib>=1.0.0",
  "google-generativeai>=0.5.4"
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "respx>=0.20.2",
  "ruff>=0.5.0",
]
tui = ["prompt_toolkit>=3.0.43"]
excel = ["openpyxl>=3.1.2"]

[project.scripts]
actcli = "actcli.cli:main"
actcli-wrap = "actcli.wrapper.wrap_cli:app"
actcli-facilitator = "actcli.wrapper.facilitator_cli:app"
actcli-shell = "actcli.wrapper_tui.shell:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actcli", "src/semhost"]

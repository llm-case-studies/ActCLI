<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActCLI Web Bridge</title>
    <style>
      body { font: 13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 10px; width: 320px; color: #0f172a; }
      header { font-weight: 600; margin-bottom: 8px; color: #0891b2; }
      button { padding: 6px 10px; margin: 4px 4px 4px 0; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; cursor: pointer; }
      button.primary { background: #06b6d4; color: #fff; border-color: #0891b2; }
      .row { margin: 6px 0; }
      .small { color: #475569; font-size: 12px; }
      #status { margin-top: 8px; color: #334155; }
      code { background: #e2e8f0; padding: 1px 3px; border-radius: 4px; }
      input[type="text"], input[type="url"] { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
      details { border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px; margin: 8px 0; }
      summary { cursor: pointer; color: #0ea5e9; }
      #activity { border: 1px solid #e2e8f0; border-radius: 6px; height: 120px; overflow: auto; padding: 6px; background: #f8fafc; }
      .chip { display: inline-block; background: #e2e8f0; padding: 2px 6px; border-radius: 10px; margin-right: 6px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .label { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <header>ActCLI Web Chat Bridge</header>

    <div class="row">
      <div class="label">Session</div>
      <input type="text" id="sessionId" placeholder="Session ID or URL" />
      <div style="display:flex; gap:6px; align-items:center; margin-top:6px;">
        <input type="text" id="displayName" placeholder="Display name" style="flex:1;" />
        <input type="text" id="avatar" placeholder="Avatar" style="width:80px;" />
      </div>
      <div class="row">
        <button id="join" class="primary">Join Seminar</button>
        <button id="leave">Leave</button>
      </div>
    </div>

    <div class="row">
      <div class="label">Activity</div>
      <div id="activity"></div>
    </div>

    <div class="row">
      <div class="label">Compose</div>
      <input type="text" id="composeText" placeholder="Type a message… (Enter to send)" />
      <div class="row">
        <button id="sendNow" class="primary">Send</button>
        <span id="healthDot" class="small">Link: <span id="healthStatus">Unknown</span></span>
      </div>
    </div>

    <details>
      <summary>Link Page (Setup)</summary>
      <div class="row">
        <div class="label">Linked Controls</div>
        <div>
          <span class="chip" id="chipInput" title="">Input: —</span>
          <span class="chip" id="chipSend" title="">Send: —</span>
          <span class="chip" id="chipHistory" title="">History: —</span>
        </div>
      </div>
      <div class="row">
        <button id="pick" class="primary">Pick Page Controls</button>
        <button id="validate">Validate</button>
        <button id="health">Check Link</button>
        <button id="autoMap">Auto‑Link</button>
      </div>
      <div class="row">
        <button id="export">Export Link</button>
        <button id="import">Import Link</button>
      </div>
    </details>

    <details>
      <summary>Settings</summary>
      <div class="row">
        <div class="small">Semhost URL</div>
        <input type="url" id="semhost" placeholder="http://127.0.0.1:7530" />
        <button id="saveCfg">Save</button>
      </div>
    </details>

    <div id="status" class="small">Idle</div>
    <script src="popup.js"></script>
  </body>
  </html>

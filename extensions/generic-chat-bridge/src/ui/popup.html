<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ActCLI Web Bridge</title>
    <style>
      body { font: 13px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 10px; width: 280px; color: #0f172a; }
      header { font-weight: 600; margin-bottom: 8px; color: #0891b2; }
      button { padding: 6px 10px; margin: 4px 4px 4px 0; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 6px; cursor: pointer; }
      button.primary { background: #06b6d4; color: #fff; border-color: #0891b2; }
      .row { margin: 6px 0; }
      .small { color: #475569; font-size: 12px; }
      #status { margin-top: 8px; color: #334155; }
      code { background: #e2e8f0; padding: 1px 3px; border-radius: 4px; }
      input[type="text"] { padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <header>ActCLI Web Chat Bridge</header>
    <div class="row">
      <div class="small">Semhost URL</div>
      <input type="text" id="semhost" placeholder="http://127.0.0.1:7530" />
      <button id="saveCfg">Save</button>
    </div>
    <div class="row">
      <button id="pick" class="primary">Pick Elements</button>
      <button id="validate">Validate</button>
      <button id="health">Health</button>
    </div>
    <div class="row">
      <button id="connect">Connect</button>
      <button id="disconnect">Disconnect</button>
    </div>
    <div class="row">
      <input type="text" id="testText" placeholder="Test message (Validate uses this)" />
    </div>
    <div class="row">
      <button id="export">Export Profile</button>
      <button id="import">Import Profile</button>
    </div>
    <div id="status" class="small">Idle</div>
    <script src="popup.js"></script>
  </body>
  </html>

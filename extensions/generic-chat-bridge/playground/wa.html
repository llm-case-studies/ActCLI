<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: WhatsApp-like</title>
    <style>
      :root { --bg:#0b141a; --panel:#111b21; --muted:#8696a0; --border:#1f2937; --accent:#06b6d4; --text:#e5e7eb; --bubble:#202c33; --out:#005c4b; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); }
      .app { display: grid; grid-template-rows: 56px 1fr 84px; height: 100vh; }
      header { background: var(--panel); border-bottom: 1px solid #0f172a; display:flex; align-items:center; gap:12px; padding: 0 12px; }
      .title { font-weight:600; }
      #history { overflow:auto; padding: 12px; }
      .bubble { max-width: 66%; margin: 6px 0; padding: 8px 10px; border-radius: 10px; background: var(--bubble); }
      .incoming { align-self: flex-start; border-bottom-left-radius: 3px; }
      .outgoing { align-self: flex-end; background: var(--out); border-bottom-right-radius: 3px; }
      .row { display:flex; flex-direction: column; }
      .composer { background: var(--panel); border-top: 1px solid #0f172a; display:grid; grid-template-columns: auto 1fr auto; gap:8px; align-items:center; padding: 10px; }
      .icon { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #0f172a; background:#0f172a; color:#a7f3d0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
      .ce { min-height: 48px; max-height: 120px; overflow:auto; padding: 8px; border:1px solid #0f172a; border-radius: 10px; background:#111827; }
      .muted { color: var(--muted); font-size:12px; }
      label { user-select: none; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="title">WA-like Chat</div>
        <div class="muted" style="margin-left:8px">Enter sends • Shift+Enter newline • Buttons for emoji/attach/send</div>
        <label style="margin-left:auto; margin-right:8px"><input type="checkbox" id="simulate"/> Simulate replies</label>
      </header>
      <div id="history" role="log" aria-label="history"></div>
      <div class="composer">
        <div class="icon" title="Emoji">😊</div>
        <div id="composer" class="ce" contenteditable="true" role="textbox" aria-label="message" data-qa="wa-input"></div>
        <div id="sendBtn" class="icon" title="Send" aria-label="Send">➤</div>
      </div>
    </div>
    <script>
      const history = document.getElementById('history');
      const composer = document.getElementById('composer');
      const sendBtn = document.getElementById('sendBtn');
      const simulate = document.getElementById('simulate');
      function addBubble(text, outgoing=false) {
        const row = document.createElement('div');
        row.className = 'row';
        const b = document.createElement('div');
        b.className = 'bubble ' + (outgoing? 'outgoing':'incoming');
        b.textContent = text;
        row.appendChild(b);
        history.appendChild(row);
        history.scrollTop = history.scrollHeight;
      }
      function getText(){ return composer.innerText.trim(); }
      function clear(){ composer.innerText=''; }
      function doSend(){
        const t = getText(); if(!t) return;
        addBubble(t, true); clear();
        if (simulate.checked) setTimeout(()=> addBubble(`You said "${t}" — what do you mean?`), 450);
      }
      sendBtn.addEventListener('click', doSend);
      composer.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
      });
      // Seed some bubbles
      addBubble('Welcome to WA-like demo');
    </script>
  </body>
  </html>

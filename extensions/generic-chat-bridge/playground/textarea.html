<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: Textarea</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
      .row { display: flex; gap: 8px; }
      textarea { width: 100%; height: 80px; padding: 8px; font: inherit; }
      button { padding: 6px 12px; }
      #history { margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
      .msg { padding: 6px 8px; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h3>Playground: Textarea</h3>
    <div class="row">
      <textarea id="composer" aria-label="message"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="history" aria-label="history" role="list"></div>
    <script>
      const composer = document.getElementById('composer');
      const send = document.getElementById('send');
      const history = document.getElementById('history');
      function addMsg(text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.textContent = text;
        history.appendChild(div);
      }
      send.addEventListener('click', () => {
        const txt = composer.value.trim();
        if (!txt) return;
        addMsg(txt);
        composer.value = '';
      });
    </script>
  </body>
  </html>

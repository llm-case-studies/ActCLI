<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: Rocket.Chat-like</title>
    <style>
      :root { --bg:#0b0c10; --panel:#0f172a; --sidebar:#0e1621; --muted:#9ca3af; --border:#1f2937; --accent:#06b6d4; --text:#e5e7eb; --bubble:#111827; --out:#0b3d3a; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); }
      .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
      .sidebar { background: var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; }
      .sb-head { padding: 12px; border-bottom:1px solid var(--border); font-weight: 600; }
      .channels { padding: 8px; overflow:auto; }
      .ch { padding:8px 10px; border-radius: 6px; cursor: pointer; }
      .ch.active, .ch:hover { background:#18212e; }
      .main { display:grid; grid-template-rows: 56px 1fr 84px; }
      .head { background: var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; padding: 0 12px; }
      .title { font-weight:600; }
      #history { overflow:auto; padding: 12px; }
      .message { margin:6px 0; display:flex; }
      .bubble { background: var(--bubble); border:1px solid var(--border); border-radius: 10px; padding: 8px 10px; max-width:70%; }
      .outgoing .bubble { background:#0e2f2e; }
      .composer { background: var(--panel); border-top:1px solid var(--border); display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; padding:10px; }
      .btn { width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius: 50%; border:1px solid var(--border); background:#0f172a; color:#a7f3d0; cursor:pointer; }
      .ce { min-height: 52px; max-height: 120px; overflow:auto; padding: 8px; border:1px solid var(--border); border-radius: 10px; background:#111827; }
      .muted { color: var(--muted); font-size:12px; }
      .bar { display:flex; align-items:center; gap:12px; padding: 8px 12px; border-bottom:1px solid var(--border); background:#0f172a; }
      label { user-select: none; }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="muted">Rocket.Chat-like Mock</div>
      <label><input type="checkbox" id="simulate"/> Simulate replies</label>
      <label><input type="checkbox" id="mutate"/> Mutate classes</label>
    </div>
    <div class="app">
      <div class="sidebar" role="navigation" aria-label="channels">
        <div class="sb-head">ActCLI workspace</div>
        <div class="channels" role="list">
          <div class="ch active" role="listitem"># general</div>
          <div class="ch" role="listitem"># e2e</div>
          <div class="ch" role="listitem"># random</div>
        </div>
      </div>
      <div class="main">
        <div class="head">
          <div class="title" data-qa="room-title"># e2e</div>
        </div>
        <div id="history" role="list" aria-label="history">
          <div class="message incoming" role="listitem"><div class="bubble">Welcome to RC-like mock</div></div>
        </div>
        <div class="composer">
          <div class="btn" title="Attach">📎</div>
          <div id="composer" class="ce" contenteditable="true" role="textbox" aria-label="message" data-qa="rc-input"></div>
          <div id="sendBtn" class="btn" title="Send" aria-label="Send">➤</div>
        </div>
      </div>
    </div>
    <script>
      const history = document.getElementById('history');
      const composer = document.getElementById('composer');
      const simulate = document.getElementById('simulate');
      const mutate = document.getElementById('mutate');
      const sendBtn = document.getElementById('sendBtn');
      function addMsg(text, out=false){
        const m = document.createElement('div');
        m.className = 'message ' + (out? 'outgoing' : 'incoming');
        m.setAttribute('role','listitem');
        const b = document.createElement('div'); b.className='bubble'; b.textContent = text; m.appendChild(b);
        history.appendChild(m); history.scrollTop = history.scrollHeight;
      }
      function text(){ return composer.innerText.trim(); }
      function clear(){ composer.innerText=''; }
      function send(){ const t=text(); if(!t) return; addMsg(t,true); clear(); if (simulate.checked) setTimeout(()=> addMsg(`You said "${t}" — what do you mean?`), 420); }
      sendBtn.addEventListener('click', send);
      composer.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
      // Mutate classes to stress selectors
      mutate.addEventListener('change', ()=>{
        const flip = mutate.checked;
        document.querySelectorAll('.bubble').forEach(n=>{ n.classList.toggle('rcx-box', flip); });
        document.querySelectorAll('.message').forEach(n=>{ n.classList.toggle('rcx-message', flip); });
      });
    </script>
  </body>
  </html>

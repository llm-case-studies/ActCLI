<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: Minimal</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background:#0b0c10; color:#e5e7eb; }
      .ce { min-height: 80px; padding: 10px; border: 1px solid #1f2937; border-radius: 8px; background:#111827; }
      #history { margin-top: 16px; border-top: 1px solid #1f2937; padding-top: 12px; }
      .msg { padding: 6px 8px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; margin-bottom: 8px; }
      .muted { color:#9ca3af; font-size:12px; }
      label { user-select: none; }
    </style>
  </head>
  <body>
    <h3>Playground: Minimal (input only)</h3>
    <div class="muted" style="margin-bottom:8px">
      No send button • Enter sends • Shift+Enter inserts newline.
      <label style="margin-left:12px"><input type="checkbox" id="simulate" /> Simulate replies</label>
    </div>
    <div id="composer" class="ce" contenteditable="true" role="textbox" aria-label="message" placeholder="Type a message…"></div>
    <div id="history" aria-label="history" role="list"></div>
    <script>
      const composer = document.getElementById('composer');
      const simulate = document.getElementById('simulate');
      const history = document.getElementById('history');
      function getText() { return composer.innerText.trim(); }
      function clearText() { composer.innerText = ''; }
      function addMsg(text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.textContent = text;
        history.appendChild(div);
      }
      function doSend() {
        const txt = getText();
        if (!txt) return;
        addMsg(txt);
        clearText();
        if (simulate.checked) {
          setTimeout(() => addMsg(`You said "${txt}" — what do you mean?`), 400);
        }
      }
      composer.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
      });
    </script>
  </body>
  </html>

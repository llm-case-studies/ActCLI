<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: Virtualized History</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background:#0b0c10; color:#e5e7eb; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .ce { min-height: 100px; padding: 10px; border: 1px solid #1f2937; border-radius: 8px; background:#111827; }
      button { padding: 6px 12px; }
      #viewport { height: 240px; overflow: auto; border: 1px solid #1f2937; border-radius: 6px; margin-top: 12px; background:#111827; }
      #history { position: relative; }
      .msg { padding: 6px 8px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; margin: 6px; }
      .placeholder { height: 24px; margin: 6px; background: #0f172a; border-radius: 4px; }
      .muted { color:#9ca3af; font-size:12px; }
      label { user-select: none; }
    </style>
  </head>
  <body>
    <h3>Playground: Virtualized History</h3>
    <div class="muted" style="margin-bottom:8px">
      Enter sends • Shift+Enter newline.
      <label style="margin-left:12px"><input type="checkbox" id="simulate" /> Simulate replies</label>
    </div>
    <div class="row">
      <div id="composer" class="ce" contenteditable="true" role="textbox" aria-label="message"></div>
      <button id="send">Send</button>
    </div>
    <div id="viewport" aria-label="viewport">
      <div id="history" aria-label="history" role="list"></div>
    </div>
    <script>
      const composer = document.getElementById('composer');
      const send = document.getElementById('send');
      const simulate = document.getElementById('simulate');
      const viewport = document.getElementById('viewport');
      const history = document.getElementById('history');

      let items = []; // { id, text }
      let nextId = 1;
      let rowH = 0; // measured row height including margins

      function measureRowHeight() {
        const probe = document.createElement('div');
        probe.className = 'msg';
        probe.textContent = 'probe';
        probe.style.visibility = 'hidden';
        history.appendChild(probe);
        const rect = probe.getBoundingClientRect();
        const cs = getComputedStyle(probe);
        const mt = parseFloat(cs.marginTop || '0');
        const mb = parseFloat(cs.marginBottom || '0');
        rowH = Math.max(1, Math.round(rect.height + mt + mb));
        probe.remove();
      }

      function addItem(text) {
        console.log('[VIRT] addItem called with:', JSON.stringify(text));
        const newItem = { id: nextId++, text };
        items.push(newItem);
        console.log('[VIRT] items.length now:', items.length, 'last item:', newItem);
        render();
      }

      function visibleRange(explicitScrollTop) {
        if (!rowH) measureRowHeight();
        const total = items.length;
        const top = explicitScrollTop !== undefined ? explicitScrollTop : viewport.scrollTop;
        const client = viewport.clientHeight;
        const overscan = 2; // reduce overscan to prevent too many items
        const visibleRows = Math.ceil(client / rowH);
        const needed = Math.max(1, visibleRows + overscan);
        let start = Math.floor(top / rowH) - Math.floor(overscan / 2);
        start = Math.max(0, start);
        let end = Math.min(total, start + needed);

        // Ensure we don't go past the end
        if (end > total) {
          end = total;
          start = Math.max(0, end - needed);
        }

        console.log('[VIRT] visibleRange calc: top=', top, 'client=', client, 'rowH=', rowH, 'visibleRows=', visibleRows, 'total=', total, 'needed=', needed, 'start=', start, 'end=', end);
        return { start, end };
      }

      function render(preserveScroll = true, explicitScrollTop) {
        if (!rowH) measureRowHeight();
        const prevTop = preserveScroll ? viewport.scrollTop : undefined;
        
        history.innerHTML = '';
        history.style.height = (items.length * rowH) + 'px';

        const { start, end } = visibleRange(explicitScrollTop);
        console.log('[VIRT] render() - visible range:', start, 'to', end, 'of', items.length, 'preserveScroll:', preserveScroll);

        for (let i = start; i < end; i++) {
          const it = items[i];
          const div = document.createElement('div');
          div.className = 'msg';
          div.textContent = it.text;
          div.style.position = 'absolute';
          div.style.top = (i * rowH) + 'px';
          div.style.left = '0';
          div.style.right = '0';
          history.appendChild(div);
        }
        
        // preserve scroll position across render (unless explicitly disabled)
        if (preserveScroll && prevTop !== undefined) {
          viewport.scrollTop = prevTop;
        }

        const renderedMsgs = Array.from(document.querySelectorAll('#history .msg')).map(n => n.textContent);
        console.log('[VIRT] rendered messages:', renderedMsgs.slice(-3)); // Show last 3
      }

      let rafScheduled = false;
      viewport.addEventListener('scroll', () => {
        if (!rafScheduled) {
          rafScheduled = true;
          requestAnimationFrame(() => {
            render();
            rafScheduled = false;
          });
        }
      });

      function doSend() {
        console.log('[VIRT] doSend() called');
        const txt = composer.innerText.trim();
        console.log('[VIRT] extracted text:', JSON.stringify(txt));
        console.log('[VIRT] composer.innerHTML:', composer.innerHTML);
        console.log('[VIRT] composer.textContent:', JSON.stringify(composer.textContent));

        if (!txt) {
          console.log('[VIRT] No text found, returning early');
          return;
        }

        console.log('[VIRT] Adding item:', txt);
        addItem(txt);
        composer.innerText = '';
        console.log('[VIRT] Cleared composer, new innerHTML:', composer.innerHTML);

        if (simulate.checked) {
          console.log('[VIRT] Simulate checked, adding reply');
          setTimeout(() => addItem(`You said "${txt}" — what do you mean?`), 400);
        }
        // auto scroll down and render at bottom
        setTimeout(() => {
          console.log('[VIRT] Auto-scrolling to bottom');
          scrollUpdateInProgress = true;
          console.log('[VIRT] Before scroll: scrollTop=', viewport.scrollTop, 'scrollHeight=', viewport.scrollHeight);
          viewport.scrollTop = viewport.scrollHeight;
          console.log('[VIRT] After scroll: scrollTop=', viewport.scrollTop, 'scrollHeight=', viewport.scrollHeight);
          requestAnimationFrame(() => {
            console.log('[VIRT] In RAF: scrollTop=', viewport.scrollTop, 'scrollHeight=', viewport.scrollHeight);
            const targetScrollTop = viewport.scrollHeight;
            render(false, targetScrollTop); // Don't preserve scroll, use target position
            // Force scroll again after render in case the scroll height changed
            viewport.scrollTop = targetScrollTop;
            console.log('[VIRT] Final scroll: scrollTop=', viewport.scrollTop, 'scrollHeight=', viewport.scrollHeight);
            // Keep scroll update in progress for a bit longer to prevent immediate scroll events
            setTimeout(() => {
              scrollUpdateInProgress = false;
              console.log('[VIRT] Scroll update complete');
            }, 100);
          });
        }, 0);
      }
      send.addEventListener('click', () => {
        console.log('[VIRT] Send button clicked');
        doSend();
      });
      composer.addEventListener('keydown', (e) => {
        console.log('[VIRT] Keydown in composer:', e.key, 'shift:', e.shiftKey);
        if (e.key === 'Enter' && !e.shiftKey) {
          console.log('[VIRT] Enter without shift - preventing default and calling doSend');
          e.preventDefault();
          doSend();
        }
      });

      // Seed some items to simulate large history
      for (let i = 0; i < 50; i++) items.push({ id: nextId++, text: 'hello #' + i });
      measureRowHeight();
      console.log('[VIRT] Initial setup - items.length:', items.length, 'rowH:', rowH);
      
      // Set the full height of the history container first
      history.style.height = (items.length * rowH) + 'px';
      
      // Start at the bottom to show the latest messages
      viewport.scrollTop = viewport.scrollHeight;
      
      // Now render the visible items
      render(false, viewport.scrollTop); 
      console.log('[VIRT] Page loaded and rendered');

      window.__virt = {
        scrollToBottom: () => {
          viewport.scrollTop = viewport.scrollHeight;
          render(false, viewport.scrollHeight);
        },
        scrollToTop: () => {
          console.log('[VIRT] scrollToTop called');
          viewport.scrollTop = 0;
          console.log('[VIRT] Set scrollTop to 0, now calling render with explicit 0');
          render(false, 0);
          console.log('[VIRT] After render, actual scrollTop:', viewport.scrollTop);
        },
        scrollUp: () => {
          viewport.scrollTop = Math.max(0, viewport.scrollTop - 200);
          render(false, viewport.scrollTop);
        },
        scrollDown: () => {
          viewport.scrollTop = Math.min(viewport.scrollHeight, viewport.scrollTop + 200);
          render(false, viewport.scrollTop);
        },
        info: () => ({ top: viewport.scrollTop, sh: viewport.scrollHeight, ch: viewport.clientHeight, rowH, len: items.length }),
        visible: () => Array.from(document.querySelectorAll('#history .msg')).map(n => n.textContent),
        testSend: (text) => { composer.innerText = text; doSend(); },
        items: () => items
      };
    </script>
  </body>
  </html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground: Contenteditable</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
      .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
      .ce { min-height: 80px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; }
      button { padding: 6px 12px; }
      #history { margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
      .msg { padding: 6px 8px; background: #f1f5f9; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h3>Playground: Contenteditable</h3>
    <div class="row">
      <div id="composer" class="ce" contenteditable="true" role="textbox" aria-label="message"></div>
      <button id="send">Send</button>
    </div>
    <div id="history" aria-label="history" role="list"></div>
    <script>
      const composer = document.getElementById('composer');
      const send = document.getElementById('send');
      const history = document.getElementById('history');
      function getText() { return composer.innerText.trim(); }
      function clearText() { composer.innerText = ''; }
      function addMsg(text) {
        const div = document.createElement('div');
        div.className = 'msg';
        div.textContent = text;
        history.appendChild(div);
      }
      send.addEventListener('click', () => {
        const txt = getText();
        if (!txt) return;
        addMsg(txt);
        clearText();
      });
    </script>
  </body>
  </html>

version: '3.8'

# Dev-only ActCLI chat-bridge harness.
# Rocket.Chat and Zulip provide self-hosted Slack-like surfaces so the
# browser extension can learn selectors and validate send/read behavior without
# touching real third-party chat accounts. Do not treat this as production
# infrastructure. Prefer on-demand starts and localhost-only port binds when
# reviving it.
services:
  rocketchat:
    # Backed by the mongo service below. Existing MSI test data was tiny seeded
    # harness content, not an operational chat archive.
    image: registry.rocket.chat/rocketchat/rocket.chat:latest
    restart: unless-stopped
    environment:
      - PORT=3000
      - ROOT_URL=http://localhost:3000
      - MONGO_URL=mongodb://mongo:27017/rocketchat
      - MONGO_OPLOG_URL=mongodb://mongo:27017/local
    ports:
      - '3000:3000'
    depends_on:
      - mongo

  mongo:
    # Rocket.Chat requires a replica set for oplog support. If this container is
    # marked unhealthy while Rocket.Chat works, inspect the healthcheck before
    # assuming Mongo is down.
    image: mongo:6
    restart: unless-stopped
    command: mongod --oplogSize 128 --replSet rs0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongosh --quiet) -eq 1
      interval: 10s
      timeout: 10s
      retries: 5

  zulip:
    # Optional second chat surface. Requires administrator configuration before
    # use; otherwise it exits and restart-loops.
    image: zulip/docker-zulip:7.4-0
    restart: unless-stopped
    environment:
      - DB_HOST=zulip_db
      - SETTING_EXTERNAL_HOST=localhost
      - SSL_CERTIFICATE_GENERATION=self-signed
    ports:
      - '9991:9991'
    depends_on:
      - zulip_db

  zulip_db:
    image: postgres:16
    environment:
      - POSTGRES_USER=zulip
      - POSTGRES_PASSWORD=zulip
      - POSTGRES_DB=zulip
    volumes:
      - zulip-db:/var/lib/postgresql/data

volumes:
  mongo-data: {}
  zulip-db: {}

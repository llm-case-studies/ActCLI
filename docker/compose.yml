# ActCLI Semhost — Compose (starter)
version: '3.9'
services:
  semhost:
    # Either build locally (requires a Dockerfile) or use a published image
    build: .
    # image: ghcr.io/actcli/semhost:latest
    ports:
      - "7530:7530"
    environment:
      SEMHOST_BIND: 0.0.0.0
      SEMHOST_PORT: 7530
      SEMHOST_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SEMHOST_CLI_DISABLE_TOOLS: "1"
      ACTCLI_REQUIRE_AUTH: "0"
    volumes:
      - ../ro:/mnt/ro:ro
      - ../out:/out
      - ../work:/mnt/rw
    restart: unless-stopped
